backend:
  name: github
  repo: melihaydogan377/btuutat-web # Örn: melih/btuutat-web
  branch: main # Repository'nin ana dalı (main veya master)
  auth_type: implicit

media_folder: "uploads" # Resimlerin yükleneceği klasör
public_folder: "/uploads"

collections:
  - name: "news"
    label: "Haberler & Duyurular"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Yayın Tarihi", name: "date", widget: "datetime" }
      - { label: "Özet Metin", name: "summary", widget: "text" }
      - { label: "Kapak Görseli", name: "image", widget: "image", required: false }
      - { label: "Kategori", name: "category", widget: "select", options: ["Etkinlik", "Duyuru", "Başarılarımız", "Genel"] }
      - { label: "Haber Detayı", name: "body", widget: "markdown" }
