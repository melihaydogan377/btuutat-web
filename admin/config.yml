backend:
  name: github
  repo: KULLANICI_ADI/REPO_ADI # Örn: btu-tat/btuutat-web
  branch: main # veya master

media_folder: "public/uploads" # Yüklenen resimlerin kaydedileceği yer
public_folder: "/uploads" # Resimlerin sitede görüneceği URL yolu

collections:
  - name: "news"
    label: "Haberler & Duyurular"
    folder: "content/news" # Haberlerin .md olarak kaydedileceği klasör
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Yayın Tarihi", name: "date", widget: "datetime" }
      - { label: "Özet Metin", name: "summary", widget: "text" }
      - { label: "Kapak Görseli", name: "image", widget: "image", required: false }
      - { label: "Kategori", name: "category", widget: "select", options: ["Etkinlik", "Duyuru", "Başarılarımız", "Genel"] }
      - { label: "Haber Detayı (Markdown)", name: "body", widget: "markdown" }
